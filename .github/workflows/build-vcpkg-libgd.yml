name: Build Musl Static libgd (Alpine)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-musl-static:
    runs-on: ubuntu-latest
    container: alpine:latest

    steps:
      - name: Install Alpine system dependencies
        run: |
          apk update
          apk add git curl zip unzip tar pkgconfig build-base cmake ninja \
                  autoconf automake libtool linux-headers gcompat

      - name: Install vcpkg and build musl static libgd
        env:
          VCPKG_FORCE_SYSTEM_BINARIES: 1
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh
          
          mkdir -p triplets/community
          cat <<EOF > triplets/x64-linux-musl-static.cmake
          set(VCPKG_TARGET_ARCHITECTURE x64)
          set(VCPKG_CRT_LINKAGE static)
          set(VCPKG_LIBRARY_LINKAGE static)
          set(VCPKG_CMAKE_SYSTEM_NAME Linux)
          EOF
          
          ./vcpkg install "libgd[core,png,jpeg,freetype,webp]:x64-linux-musl-static"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-libgd-musl-static-output
          path: |
            vcpkg/installed/x64-linux-musl-static/lib/
            vcpkg/installed/x64-linux-musl-static/include/
